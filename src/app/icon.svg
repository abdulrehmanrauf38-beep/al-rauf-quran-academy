      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="greenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#145c42" />
      <stop offset="100%" stop-color="#0f3d2e" />
